// serverDZ.cfg - DayZ dedicated server configuration.
// Docs: https://community.bohemia.net/wiki/DayZ:Server_Configuration
// Reloaded every container start; edit then restart to apply.

hostname      = "My DayZ Server";   // name shown in the server browser
password      = "";                 // join password, "" = public
passwordAdmin = "CHANGEME";         // #login password for in-game admin
maxPlayers    = 60;

verifySignatures = 2;               // 2 = kick clients with unsigned/foreign mods
forceSameBuild   = 1;               // 1 = only allow clients on the same build

disableVoN         = 0;             // 1 = disable voice chat
vonCodecQuality    = 20;            // 1-30
disable3rdPerson   = 0;             // 1 = first-person only
disableCrosshair   = 0;             // 1 = no crosshair
disablePersonalLight = 1;           // personal light around player camera
lightingConfig       = 0;           // 0 = default day/night lighting

serverTime                  = "SystemTime";   // or "yyyy/MM/dd/HH/mm" custom start
serverTimeAcceleration      = 12;             // day speed multiplier (0-24)
serverNightTimeAcceleration = 1;              // applied to serverTimeAcceleration
serverTimePersistent        = 0;              // 1 = save time across restarts

guaranteedUpdates   = 1;
enableCfgGameplayFile = 1;          // read cfggameplay.json from the mission
allowFilePatching     = 0;
simulatedPlayersBatch = 20;
multithreadedReplication = 1;
speedhackDetection  = 1;

loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers        = 500;
instanceId         = 1;             // persistence hive id; change = separate hive
storageAutoFix     = 1;             // auto-fix corrupted persistence files
respawnTime        = 5;             // seconds until respawn is allowed

motd[] = { "Welcome to the server." };   // shown in chat on join
timeStampFormat = "Short";

// Logging (files land in the profiles dir).
logAverageFps = 60;
logMemory     = 60;
logPlayers    = 60;
logFile       = "server_console.log";
adminLogPlayerHitsOnly = 0;
adminLogPlacement      = 0;
adminLogBuildActions   = 0;
adminLogPlayerList     = 0;

steamQueryPort = 27016;             // UDP port for the Steam server browser

class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus";   // Livonia: dayzOffline.enoch
    };
};
